<!DOCTYPE html>
<html lang="en">

<head>
       
    <meta charset="UTF-8" />
       
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
       
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

       
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />

        <title>Web-GIS Kabupaten Bandung</title>

        <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        /* Membatasi tinggi legenda agar tidak menutupi layar dan bisa di-scroll */
        .legend {
            max-height: 220px;
            overflow-y: auto;
        }
    </style>
</head>

<body>
        <div id="map"></div>

       
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

       
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

       
    <script src="lib/L.Geoserver.js"></script>

       
    <script>
        var map = L.map("map").setView([-7.0222, 107.5286], 11);

        var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });
        osm.addTo(map);

        var wmsLayer1 = L.Geoserver.wms("http://localhost:8080/geoserver/wms", {
            layers: "pgweb:Batas_kecamatan_kab.bandung",
            transparent: true,
        });
        wmsLayer1.addTo(map);

        var wmsLayer2 = L.Geoserver.wms("http://localhost:8080/geoserver/wms", {
            layers: "pgweb:sungai_kab_bandung",
            transparent: true,
        });
        wmsLayer2.addTo(map);

        // Legenda 1: Batas Kecamatan
        var layerLegend1 = L.Geoserver.legend("http://localhost:8080/geoserver/wms", {
            layers: "pgweb:Batas_kecamatan_kab.bandung",
        });
        layerLegend1.addTo(map);

        // Legenda 2: Sungai Kab. Bandung
        var layerLegend2 = L.Geoserver.legend("http://localhost:8080/geoserver/wms", {
            layers: "pgweb:sungai_kab_bandung",
        });
        layerLegend2.addTo(map);

        var baseMaps = {
            "OpenStreetMap": osm
        };

        var overlayMaps = {
            "Batas Kecamatan": wmsLayer1,
            "Sungai": wmsLayer2
        };

        var layerControl = L.control.layers(baseMaps, overlayMaps).addTo(map);

        // Event listener agar legenda otomatis mengikuti status Layer Control
        map.on("overlayadd", function (eventLayer) {
            if (eventLayer.name === "Batas Kecamatan") {
                layerLegend1.addTo(map);
            } else if (eventLayer.name === "Sungai") {
                layerLegend2.addTo(map);
            }
        });

        map.on("overlayremove", function (eventLayer) {
            if (eventLayer.name === "Batas Kecamatan") {
                map.removeControl(layerLegend1);
            } else if (eventLayer.name === "Sungai") {
                map.removeControl(layerLegend2);
            }
        });
    </script>
</body>

</html>
